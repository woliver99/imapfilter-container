services:
  imapfilter:
    image: ghcr.io/woliver99/imapfilter-container:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imapfilter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./rules:/rules:ro
      - imapfilter-tokens:/tokens

volumes:
  imapfilter-tokens:
